name: Deploy to GitHub Pages

# 推送到 main 分支即自动构建并发布；也可以在仓库的 Actions 页面手动触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 需要这些权限才能创建 / 发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一个发布任务，新的推送会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 注意：GitHub 不允许用流水线里的令牌自动创建 Pages 站点，
      # 所以必须在仓库 Settings → Pages → Source 里手动选一次 "GitHub Actions"。
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
