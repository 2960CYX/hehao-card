<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b050b" />
    <title>签名采集 · 和好卡</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background: linear-gradient(180deg, #2a0a12 0%, #1b050b 60%, #120306 100%);
        color: #fff;
        font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Heiti SC', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 16px calc(env(safe-area-inset-bottom, 0px) + 32px);
      }
      .wrap { width: 100%; max-width: 620px; }
      h1 {
        margin: 0 0 6px;
        font-size: 20px;
        letter-spacing: 0.08em;
        text-align: center;
        background: linear-gradient(120deg, #fff6cf, #e8c96a 45%, #fff3c4 62%, #c9a227);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sub { margin: 0 0 18px; text-align: center; font-size: 13px; color: rgba(255,255,255,.55); line-height: 1.7; }
      .surface {
        position: relative;
        width: 100%;
        height: 300px;
        border-radius: 18px;
        overflow: hidden;
        background: linear-gradient(180deg, #fffdf8 0%, #fbf4e8 100%);
        box-shadow: 0 18px 44px -20px rgba(0,0,0,.9), inset 0 2px 10px rgba(120,86,20,.12);
      }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none; }
      .baseline { position: absolute; left: 7%; right: 7%; bottom: 22%; border-bottom: 1px dashed rgba(140,116,80,.35); pointer-events: none; }
      .ghost {
        position: absolute; inset: 0; display: grid; place-items: center;
        font-size: 15px; letter-spacing: .3em; color: rgba(140,116,80,.32);
        pointer-events: none; transition: opacity .25s ease;
      }
      .actions { display: flex; gap: 12px; margin-top: 18px; }
      button {
        flex: 1 1 0; min-height: 52px; border: 0; border-radius: 999px;
        font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
        transition: transform .15s ease, opacity .2s ease;
      }
      button:active:not(:disabled) { transform: scale(.97); }
      button:disabled { opacity: .4; cursor: not-allowed; }
      .btn-ghost { color: rgba(255,255,255,.86); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); }
      .btn-main { color: #3a2405; background: linear-gradient(135deg, #fff3c4 0%, #e8c96a 45%, #c9a227 100%); }
      .tips { margin: 22px 0 0; padding: 16px 18px; border-radius: 16px; border: 1px dashed rgba(232,201,106,.4); background: rgba(212,175,55,.08); }
      .tips h2 { margin: 0 0 10px; font-size: 13px; color: #ffe9b0; letter-spacing: .06em; }
      .tips ol { margin: 0; padding-left: 20px; font-size: 12.5px; line-height: 1.9; color: rgba(255,255,255,.72); }
      .tips code { padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.12); font-size: 12px; }
      .done { display: none; margin-top: 16px; padding: 13px 16px; border-radius: 14px; font-size: 13px; line-height: 1.6;
              color: #b8f5cd; border: 1px solid rgba(52,211,153,.45); background: rgba(16,185,129,.18); text-align: center; }
      .done.show { display: block; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>签名采集</h1>
      <p class="sub">这是给「和好卡」用的：<br />在下面写好你的签名，保存成图片，它就会被印到卡片的「持卡人签名」那一栏。</p>

      <div class="surface">
        <canvas id="pad"></canvas>
        <div class="baseline"></div>
        <div class="ghost" id="ghost">在这里签名</div>
      </div>

      <div class="actions">
        <button class="btn-ghost" id="clear" disabled>清除重写</button>
        <button class="btn-main" id="save" disabled>保存签名图片</button>
      </div>

      <div class="done" id="done">✅ 已保存 <b id="fname">holder-sign.png</b>。<br />把这个文件放到项目的 <b>public</b> 文件夹里就能用了。</div>

      <div class="tips">
        <h2>怎么用</h2>
        <ol>
          <li>用鼠标在白色区域签名；手机上用手指签效果更好</li>
          <li>点「保存签名图片」，会下载一个 <code>holder-sign.png</code></li>
          <li>把它放到 <code>和好卡\public\</code> 文件夹里（覆盖同名文件）</li>
          <li>告诉我一声，我会把它印到卡片上（这一步我来做就行）</li>
        </ol>
      </div>
    </div>

    <script>
      (function () {
        var INK = '#141821'
        var BASE_PX = 2.6
        var MIN_PX = 1.2
        var MAX_PX = 4.2

        var canvas = document.getElementById('pad')
        var ghost = document.getElementById('ghost')
        var btnClear = document.getElementById('clear')
        var btnSave = document.getElementById('save')
        var done = document.getElementById('done')
        var fname = document.getElementById('fname')

        var ctx = null
        var strokes = []
        var current = null
        var drawing = false
        var lastPoint = null
        var lastTime = 0
        var lastWidthPx = BASE_PX
        var cssW = 1
        var cssH = 1

        function toNormWidth(px) { return px / Math.max(cssW, 1) }

        function toNorm(e) {
          var r = canvas.getBoundingClientRect()
          return {
            x: (e.clientX - r.left) / Math.max(r.width, 1),
            y: (e.clientY - r.top) / Math.max(r.height, 1),
            w: toNormWidth(BASE_PX)
          }
        }

        function drawSegment(a, b, w, h, g) {
          if (!g) return
          g.strokeStyle = INK
          g.lineWidth = Math.max(((a.w + b.w) / 2) * w, 0.4)
          g.beginPath()
          g.moveTo(a.x * w, a.y * h)
          g.lineTo(b.x * w, b.y * h)
          g.stroke()
        }

        function paintStroke(g, pts, w, h) {
          if (!pts.length) return
          g.strokeStyle = INK
          g.fillStyle = INK
          g.lineCap = 'round'
          g.lineJoin = 'round'
          if (pts.length === 1) {
            g.beginPath()
            g.arc(pts[0].x * w, pts[0].y * h, Math.max((pts[0].w * w) / 2, 0.4), 0, Math.PI * 2)
            g.fill()
            return
          }
          for (var i = 1; i < pts.length; i++) drawSegment(pts[i - 1], pts[i], w, h, g)
        }

        function syncSize() {
          var r = canvas.getBoundingClientRect()
          cssW = Math.max(r.width, 1)
          cssH = Math.max(r.height, 1)
          var dpr = Math.min(window.devicePixelRatio || 1, 3)
          canvas.width = Math.round(cssW * dpr)
          canvas.height = Math.round(cssH * dpr)
          ctx = canvas.getContext('2d')
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
          ctx.lineCap = 'round'
          ctx.lineJoin = 'round'
          ctx.clearRect(0, 0, cssW, cssH)
          for (var i = 0; i < strokes.length; i++) paintStroke(ctx, strokes[i], cssW, cssH)
        }

        function refresh() {
          var empty = strokes.length === 0
          ghost.style.opacity = empty ? 1 : 0
          btnClear.disabled = empty
          btnSave.disabled = empty
        }

        function pushPoint(p, time) {
          if (!current) return
          var prev = lastPoint
          if (!prev) { current.push(p); lastPoint = p; lastTime = time; return }
          var dx = (p.x - prev.x) * cssW
          var dy = (p.y - prev.y) * cssH
          var dist = Math.sqrt(dx * dx + dy * dy)
          if (dist < 0.6) return
          var dt = Math.max(time - lastTime, 1)
          var target = Math.min(MAX_PX, Math.max(MIN_PX, BASE_PX * (1.7 - (dist / dt) * 2.8)))
          lastWidthPx += (target - lastWidthPx) * 0.45
          p.w = toNormWidth(lastWidthPx)
          current.push(p)
          drawSegment(prev, p, cssW, cssH, ctx)
          lastPoint = p
          lastTime = time
        }

        canvas.addEventListener('pointerdown', function (e) {
          if (e.pointerType === 'mouse' && e.button !== 0) return
          e.preventDefault()
          try { canvas.setPointerCapture(e.pointerId) } catch (err) {}
          drawing = true
          lastWidthPx = BASE_PX
          lastPoint = null
          lastTime = e.timeStamp
          current = [toNorm(e)]
          strokes.push(current)
          refresh()
        })

        canvas.addEventListener('pointermove', function (e) {
          if (!drawing || !current) return
          e.preventDefault()
          var list = [e]
          if (typeof e.getCoalescedEvents === 'function') {
            try { var c = e.getCoalescedEvents(); if (c.length) list = c } catch (err) {}
          }
          for (var i = 0; i < list.length; i++) pushPoint(toNorm(list[i]), list[i].timeStamp || e.timeStamp)
        })

        function endStroke(e) {
          if (!drawing) return
          drawing = false
          current = null
          lastPoint = null
          try { canvas.releasePointerCapture(e.pointerId) } catch (err) {}
        }
        canvas.addEventListener('pointerup', endStroke)
        canvas.addEventListener('pointercancel', endStroke)
        canvas.addEventListener('lostpointercapture', endStroke)
        canvas.addEventListener('contextmenu', function (e) { e.preventDefault() })

        btnClear.addEventListener('click', function () {
          strokes = []
          current = null
          lastPoint = null
          drawing = false
          done.classList.remove('show')
          syncSize()
          refresh()
        })

        /** 裁到笔迹外框，按 3 倍分辨率导出透明 PNG */
        btnSave.addEventListener('click', function () {
          var minX = 1, minY = 1, maxX = 0, maxY = 0
          for (var i = 0; i < strokes.length; i++) {
            for (var j = 0; j < strokes[i].length; j++) {
              var p = strokes[i][j]
              if (p.x < minX) minX = p.x
              if (p.y < minY) minY = p.y
              if (p.x > maxX) maxX = p.x
              if (p.y > maxY) maxY = p.y
            }
          }
          if (maxX <= minX || maxY <= minY) return

          var padX = 0.02
          var padY = 0.04
          minX = Math.max(0, minX - padX); maxX = Math.min(1, maxX + padX)
          minY = Math.max(0, minY - padY); maxY = Math.min(1, maxY + padY)

          var scale = 3
          var outW = Math.round((maxX - minX) * cssW * scale)
          var outH = Math.round((maxY - minY) * cssH * scale)
          var off = document.createElement('canvas')
          off.width = Math.max(outW, 1)
          off.height = Math.max(outH, 1)
          var g = off.getContext('2d')
          g.scale(scale, scale)
          g.translate(-minX * cssW, -minY * cssH)
          g.lineCap = 'round'
          g.lineJoin = 'round'
          for (var k = 0; k < strokes.length; k++) paintStroke(g, strokes[k], cssW, cssH)

          var a = document.createElement('a')
          a.download = 'holder-sign.png'
          document.body.appendChild(a)
          // 用 blob URL 下载：直接双击打开本文件（file://）时也能正常保存
          off.toBlob(function (blob) {
            if (!blob) return
            var url = URL.createObjectURL(blob)
            a.href = url
            a.click()
            setTimeout(function () { URL.revokeObjectURL(url) }, 4000)
          }, 'image/png')
          document.body.removeChild(a)
          fname.textContent = 'holder-sign.png'
          done.classList.add('show')
        })

        syncSize()
        refresh()
        window.addEventListener('resize', syncSize)
      })()
    </script>
  </body>
</html>
